name: Make a Release

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Build run ID on the selected branch
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  make-release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN_ID: ${{ inputs.build_run_id }}
      RELEASE_BRANCH: ${{ github.ref_name }}
    steps:
      - name: Validate selected build
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN_ID" > run.json
          python3 - <<'PY'
          import json, os
          run = json.load(open('run.json'))
          assert run['conclusion'] == 'success', 'Build must have succeeded'
          assert run['path'] == '.github/workflows/build.yml', 'Select a Build workflow run'
          assert run['event'] in ('push', 'workflow_dispatch'), 'PR artifacts cannot be published'
          assert run['head_branch'] == os.environ['RELEASE_BRANCH'], 'Select a build on this branch'
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('BUILD_SHA=' + run['head_sha'] + '\n')
          PY

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Download exact build artifacts
        run: |
          artifact=ruffle-release-apks
          case "$RELEASE_BRANCH" in
            kabu) artifact=kabu-release-apks ;;
            roco) artifact=roco-release-apks ;;
          esac
          gh run download "$BUILD_RUN_ID" --name "$artifact" --dir release-apks

      - name: Verify signature and read APK version
        env:
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          python3 scripts/verify-release-signing.py release-apks/*.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -1)
          "$aapt" dump badging "$(find release-apks -name '*.apk' | sort | head -1)" > badging.txt
          python3 - <<'PY'
          import os, re
          badging = open('badging.txt').read()
          package = re.search(r"package: name='([^']+)'", badging).group(1)
          version = re.search(r"versionName='([^']+)'", badging).group(1)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'RELEASE_TAG={package}-{version}\nRELEASE_VERSION={version}\n')
          PY

      - name: Create draft release for review
        run: |
          gh release create "$RELEASE_TAG" release-apks/*.apk \
            --target "$BUILD_SHA" --title "$RELEASE_VERSION" --generate-notes --draft

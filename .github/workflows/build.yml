name: Build

on:
  push:
    branches: [ main, base, kabu ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: "r27"
  CARGO_NDK_VERSION: "4.1.2"

jobs:
  validate-signing:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require persistent release signing
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          for name in KEYSTORE SIGNING_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_CERT_SHA256; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing release signing secret: $name. No temporary signing key will be generated."
              exit 1
            fi
          done

  build-native-libs:
    needs: validate-signing
    if: ${{ !cancelled() && (needs.validate-signing.result == 'success' || github.event_name == 'pull_request') }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - android-abi: arm64-v8a
            rust-target: aarch64-linux-android

          - android-abi: armeabi-v7a
            rust-target: armv7-linux-androideabi

          - android-abi: x86_64
            rust-target: x86_64-linux-android

          - android-abi: x86
            rust-target: i686-linux-android

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup show
          rustup target add ${{ matrix.rust-target }}

      - name: Cache Cargo output
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.rust-target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk@${{ env.CARGO_NDK_VERSION }} --locked

      - name: Clean up NDKs
        run: |
          rm -r $ANDROID_NDK_HOME
          rm -r $ANDROID_NDK_LATEST_HOME

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Build native libs
        run: |
          unset ANDROID_SDK_ROOT # Deprecated, will cause an error if left set.
          cargo ndk --target ${{ matrix.android-abi }} --platform 26 -o jniLibs build --locked --release --features jpegxr
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v7
        with:
          name: native-lib-${{ matrix.android-abi }}
          path: jniLibs

  build-apks:
    needs: build-native-libs
    if: ${{ !cancelled() && needs.build-native-libs.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with: # no name set, so all artifacts are downloaded
          path: native-libs

      - name: Copy native libs
        run: |
          mkdir app/src/main/jniLibs
          cp -r native-libs/*/* app/src/main/jniLibs/

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Caching needs to be disabled because of licensing, see:
          # https://github.com/gradle/actions#licensing-notice
          cache-disabled: true

      - name: Clean up NDKs
        run: |
          rm -r $ANDROID_NDK_HOME
          rm -r $ANDROID_NDK_LATEST_HOME

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

      - name: Decode keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE: ${{ secrets.KEYSTORE }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > app/androidkey.jks

      - name: Set increasing release version
        run: |
          baseline=$(sed -n 's/^releaseVersionCode=//p' gradle.properties)
          version_name=$(sed -n 's/^releaseVersionName=//p' gradle.properties)
          echo "RELEASE_VERSION_CODE=$((baseline + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "RELEASE_VERSION_NAME=${version_name}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest assembleRelease -PreleaseVersionCode="$RELEASE_VERSION_CODE" -PreleaseVersionName="$RELEASE_VERSION_NAME"

      - name: Verify persistent signing identity
        if: github.event_name != 'pull_request'
        env:
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: python3 scripts/verify-release-signing.py app/build/outputs/apk/release/*.apk

      - name: Name game APKs
        run: |
          mkdir -p kabu-apks
          for apk in app/build/outputs/apk/release/*.apk; do
            name="${apk##*/}"
            cp "$apk" "kabu-apks/游戏不卡-${name#app-}"
          done

      - uses: actions/upload-artifact@v7
        if: github.event_name != 'pull_request'
        with:
          name: kabu-release-apks
          path: kabu-apks/*.apk

  android-tests:
    name: Android Tests
    needs: build-native-libs
    if: ${{ !cancelled() && needs.build-native-libs.result == 'success' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        api-level: [26, 36]

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with: # no name set, so all artifacts are downloaded
          path: native-libs

      - name: Copy native libs
        run: |
          mkdir app/src/main/jniLibs
          cp -r native-libs/*/* app/src/main/jniLibs/

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Caching needs to be disabled because of licensing, see:
          # https://github.com/gradle/actions#licensing-notice
          cache-disabled: true

      - name: Clean up NDKs
        run: |
          rm -r $ANDROID_NDK_HOME
          rm -r $ANDROID_NDK_LATEST_HOME

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          link-to-sdk: true

        # https://github.blog/changelog/2023-02-23-hardware-accelerated-android-virtualization-on-actions-windows-and-linux-larger-hosted-runners/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          emulator-options: -no-window -gpu swangle -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell settings put secure immersive_mode_confirmations confirmed
            ./gradlew connectedCheck

      - name: Upload Test Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }} # always run even if the previous step fails
        with:
          name: junit-test-results-${{ matrix.api-level }}
          path: '**/build/outputs/**/TEST-*.xml'
          retention-days: 1


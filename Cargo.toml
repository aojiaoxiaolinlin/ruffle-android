[package]
# Underscore because the cargo-ndk gradle plugin doesn't transform a hyphen to it.
name = "ruffle_android"
version = "0.1.0"
authors = [
    "Ruffle contributors <ruffle@ruffle.rs>",
    "TÖRÖK Attila <torokati44@gmail.com>",
    "Nathan Adams <dinnerbone@dinnerbone.com>",
]
edition = "2018"
resolver = "2"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[dependencies]

android-activity = { version = "0.6.1", features = ["game-activity"] }
android_logger = "0.15.1"

jni = "0.22.4"
# reqwest (via ruffle_frontend_utils' `rustls-tls`) verifies certificates with this,
# which on Android needs to be initialized, and its Kotlin component included.
# Keep it semver-compatible with the version reqwest uses, so they share a copy.
rustls-platform-verifier = "0.7.1"
# Select `ring` explicitly at startup, so TLS works consistently even when
# transitive features also enable another rustls crypto provider.
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ndk = { version = "0.9.0", features = ["audio"] }

# Have to follow Ruffle with this.
wgpu = { version = "30.0.1", features = ["vulkan"] }

# Pin all Ruffle crates to the tested 0.7.1-A render/cache and Loader unload fixes.
ruffle_common = { git = "https://github.com/aojiaoxiaolinlin/ruffle.git", rev = "2ea3df167492ecfb7ad4ab6d4f7def7aae88e676" }
ruffle_core = { git = "https://github.com/aojiaoxiaolinlin/ruffle.git", rev = "2ea3df167492ecfb7ad4ab6d4f7def7aae88e676", features = [
    "audio",
    "symphonia",
    "mp3",
    "nellymoser",
    "lzma",
    "default_compatibility_rules",
    "default_font",
] }
ruffle_render = { git = "https://github.com/aojiaoxiaolinlin/ruffle.git", rev = "2ea3df167492ecfb7ad4ab6d4f7def7aae88e676" }
ruffle_render_wgpu = { git = "https://github.com/aojiaoxiaolinlin/ruffle.git", rev = "2ea3df167492ecfb7ad4ab6d4f7def7aae88e676" }
ruffle_video_software = { git = "https://github.com/aojiaoxiaolinlin/ruffle.git", rev = "2ea3df167492ecfb7ad4ab6d4f7def7aae88e676" }
ruffle_frontend_utils = { git = "https://github.com/aojiaoxiaolinlin/ruffle.git", rev = "2ea3df167492ecfb7ad4ab6d4f7def7aae88e676", default-features = false, features = ["fs", "navigator", "rustls-tls"] }

log = "0.4.32"

# Redirect tracing to log
tracing = {version = "0.1.44", features = ["log", "log-always"]}
backtrace = "0.3.76"
async-task = "4.7.1"

fontdb = { version = "0.23", default-features = false, features = ["fs", "memmap"] }
url = "2.5.2"
webbrowser = "1.2.4"

tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"]}

[features]
# Detailed per-second resource snapshots are opt-in for diagnostic APKs.
diagnostics = ["ruffle_render_wgpu/detailed_diagnostics"]
jpegxr = ["ruffle_core/jpegxr"]
